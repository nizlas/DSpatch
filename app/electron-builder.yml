# Package the DSpatch client: a .deb for Ubuntu/Debian x64 and a per-user NSIS installer for
# Windows x64 (DSP-153). Other platforms and architectures are not built or tried. Signing and
# automatic updates are not part of this. `npm run package:client` is the way in; it gathers
# build/bundled first. The host is packaged apart, by scripts/build-host-package.mjs.
#
# A separate YAML file allows comments, including the packaging traps below,
# which strict JSON in package.json could not carry.

appId: dev.dspatch.app

directories:
  # Keep separate from dist/, which tsc and Vite own. electron-builder defaults
  # to dist/ too; using that default would make the tools overwrite each other.
  output: release

# The renderer is bundled by Vite. The main process is deliberately NOT bundled
# and requires @cursor/sdk at runtime through ordinary node_modules resolution,
# so the artifact needs real production dependencies inside it.
#
# THE NEGATION THAT USED TO BE HERE IS GONE, AND THAT MATTERS. Up to substep 6
# this list ended with '!node_modules/**/*', which excluded production
# dependencies *silently*: the substep 3 build dropped react and react-dom —
# declared in the artifact's package.json, absent from the archive — with exit
# code 0 and no warning. That was harmless only because Vite inlines them. With
# @cursor/sdk required by the main process it would not have been harmless; the
# artifact would have built cleanly and failed at the first Agent.create(), with
# an error resembling Cursor's documented lazy-load failure ("Cannot find module
# './986.js'"). Two unrelated causes, nearly the same surface.
#
# electron-builder walks the production dependency tree itself, so removing the
# negation is the whole fix: @cursor/sdk, its own dependencies and the platform
# package are collected without being named here. Naming them would silently
# omit whatever the tree gains next.
#
# A successful build is not evidence that a dependency is in the archive. Check
# the contents:
#   ls release/linux-unpacked/resources/app/node_modules
files:
  # dist/build-identity.json is part of this and is meant to be: it is the only
  # thing inside the artifact that says which sources it was built from. See
  # scripts/build-identity.mjs.
  - dist/**/*
  - package.json
  - '!dist/**/*.map'

# No archive. The provider runtimes are programs that have to be real files: an asar with them
# unpacked beside it still gives them paths inside the archive, where Copilot's SDK fails at
# `chmod` (ENOTDIR, seen in the installed .deb, DSP-153) and Cursor's ripgrep lookup fails too.
asar: false

# The loops, their graphs and roles, Claude's pinned list and the host manifest. Read-only in
# an installation: a person's own loops live in their projects, so an update cannot touch them.
extraResources:
  - from: build/bundled
    to: bundled

linux:
  target:
    - target: deb
      arch:
        - x64
  executableName: dspatch
  category: Development
  icon: build/icon.png
  synopsis: A workspace for agent-assisted development
  maintainer: Niclas Danielsson <niclas.danielsson@users.noreply.github.com>

deb:
  afterInstall: build/after-install.tpl
  # electron-builder's list covers Electron itself, and its postinst (ours differs on one point)
  # sets up the sandbox and, on Ubuntu 24.04, the AppArmor profile. `ssh` is Connect's; git is a
  # project's.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
    - libgbm1
    - openssh-client
    - git

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  # Off so the installer can be built on Linux without Wine. The executable then has Electron's
  # icon and no version resource; a Windows build (.github/workflows/package.yml) turns this on.
  signAndEditExecutable: false

nsis:
  # Per user: no administrator rights, installed under LocalAppData.
  oneClick: true
  perMachine: false
