# Package DSpatch as a runnable directory. Installers, signing and automatic
# updates are outside DSP-1.
#
# A separate YAML file allows comments, including the packaging traps below,
# which strict JSON in package.json could not carry.

appId: dev.dspatch.app

directories:
  # Keep separate from dist/, which tsc and Vite own. electron-builder defaults
  # to dist/ too; using that default would make the tools overwrite each other.
  output: release

# The renderer is bundled by Vite. The main process is deliberately NOT bundled
# and requires @cursor/sdk at runtime through ordinary node_modules resolution,
# so the artifact needs real production dependencies inside it.
#
# THE NEGATION THAT USED TO BE HERE IS GONE, AND THAT MATTERS. Up to substep 6
# this list ended with '!node_modules/**/*', which excluded production
# dependencies *silently*: the substep 3 build dropped react and react-dom —
# declared in the artifact's package.json, absent from the archive — with exit
# code 0 and no warning. That was harmless only because Vite inlines them. With
# @cursor/sdk required by the main process it would not have been harmless; the
# artifact would have built cleanly and failed at the first Agent.create(), with
# an error resembling Cursor's documented lazy-load failure ("Cannot find module
# './986.js'"). Two unrelated causes, nearly the same surface.
#
# electron-builder walks the production dependency tree itself, so removing the
# negation is the whole fix: @cursor/sdk, its own dependencies and the platform
# package are collected without being named here. Naming them would silently
# omit whatever the tree gains next.
#
# A successful build is not evidence that a dependency is in the archive. Check
# the contents:
#   npx asar list release/win-unpacked/resources/app.asar
files:
  # dist/build-identity.json is part of this and is meant to be: it is the only
  # thing inside the artifact that says which sources it was built from. See
  # scripts/build-identity.mjs.
  - dist/**/*
  - package.json

asar: true

# Native executables and native modules cannot be loaded from inside an asar
# archive. @cursor/sdk-win32-x64 carries four of them, measured on 1.0.31:
#
#   bin/cursorsandbox.exe                    3 372 032 B
#   bin/rg.exe                               5 344 768 B
#   vendor/tree-sitter/binding.node            476 160 B
#   vendor/tree-sitter-bash/binding.node     1 555 456 B
#
# Left inside the archive, the ripgrep lookup falls back to `rg` on PATH and
# sandboxOptions throws ConfigurationError. Unpacked, they sit beside the
# archive in resources/app.asar.unpacked/ and resolve normally.
asarUnpack:
  - node_modules/@cursor/sdk-win32-x64/**/*

win:
  target:
    - target: dir
      arch:
        - x64
