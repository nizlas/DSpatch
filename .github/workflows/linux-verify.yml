# The Linux checks of a release candidate, by hand, on GitHub's Ubuntu runners (DSP-168): the test
# groups on Linux, among them the POSIX host identity and the late-host stop that Windows cannot
# run, and the window zoom in real Xvfb windows. With `published`, the published release of the
# checked-out version is tried in clean containers, and an upgrade from the previous release.
name: linux-verify
on:
  workflow_dispatch:
    inputs:
      published:
        description: Try the published release of this version and an upgrade to it
        type: boolean
        default: false
      previous:
        description: The previous release's tag, for the upgrade trial
        type: string
        default: v0.1.4
      only:
        description: Run one job only (tests, provider-tests, windows, dock, governor, profiles); empty runs them all
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !inputs.published && (inputs.only == '' || inputs.only == 'tests') }}
    runs-on: ubuntu-24.04
    steps:
      # The review tests open this repository's own commits: a shallow clone has none of them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - name: fast
        if: ${{ !cancelled() }}
        run: xvfb-run -a node scripts/run-tests.mjs fast
        working-directory: app
      - name: host (the POSIX identity, Replace, the late host, the bundled host)
        if: ${{ !cancelled() }}
        run: xvfb-run -a node scripts/run-tests.mjs host
        working-directory: app
      - name: review
        if: ${{ !cancelled() }}
        run: xvfb-run -a node scripts/run-tests.mjs review
        working-directory: app
      - name: chat
        if: ${{ !cancelled() }}
        run: xvfb-run -a node scripts/run-tests.mjs chat
        working-directory: app
      - name: presentation
        if: ${{ !cancelled() }}
        run: xvfb-run -a node scripts/run-tests.mjs presentation
        working-directory: app

  provider-tests:
    if: ${{ !inputs.published && (inputs.only == '' || inputs.only == 'provider-tests') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: provider (the Copilot runtime with a stand-in model)
        run: xvfb-run -a node scripts/run-tests.mjs provider
        working-directory: app

  windows:
    if: ${{ !inputs.published && (inputs.only == '' || inputs.only == 'windows') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool openbox x11-xkb-utils x11-xserver-utils imagemagick
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # npm on the runner leaves Electron's install script unrun, so its binary is fetched here; and
      # Chromium's sandbox helper must be setuid root on a runner that restricts user namespaces.
      - run: test -f node_modules/electron/dist/chrome-sandbox || node node_modules/electron/install.js
        working-directory: app
      - run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
        working-directory: app
      - name: The zoom trial in real windows
        run: node scripts/zoom-trial.mjs release/trial-zoom/ci
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: zoom-trial
          path: app/release/trial-zoom/ci

  # DSP-172: the review's discussion docked in a code window, moved straight between the diff and
  # the walk window, undocked, resized and zoomed, as the X display shows it (a screenshot of the
  # root window) and with the mouse and keys through the X server.
  dock:
    if: ${{ !inputs.published && (inputs.only == '' || inputs.only == 'dock') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool openbox x11-xkb-utils x11-xserver-utils x11-utils imagemagick
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: test -f node_modules/electron/dist/chrome-sandbox || node node_modules/electron/install.js
        working-directory: app
      - run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
        working-directory: app
      - name: The dock trial in real windows
        run: node scripts/dock-trial.mjs release/trial-dock/ci
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dock-trial
          path: app/release/trial-dock/ci

  # DSP-173: the resource governor on this runner's own /proc (units, intervals, unknown signals,
  # its reading starting and stopping with a light dry loop run in observe), then the loop and live
  # areas, where enforce is tried with injected pressure. No load is generated.
  governor:
    if: ${{ !inputs.published && (inputs.only == '' || inputs.only == 'governor') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: app
      - name: The governor on this machine's /proc
        run: node --import ./scripts/ts-resolve.mjs scripts/governor-linux-check.mjs release/governor-linux-check
        working-directory: app
      - name: loop (the governor's tests, enforce with injected pressure)
        if: ${{ !cancelled() }}
        run: node scripts/run-tests.mjs loop
        working-directory: app
      - name: live (deferred command observations; the step's own snapshots)
        if: ${{ !cancelled() }}
        run: node scripts/run-tests.mjs live
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: governor-linux-check
          path: app/release/governor-linux-check

  # DSP-181: the presentation profiles in real windows: the profile chosen before the walks are
  # prepared (from the panel and beside the agent), a walk read in its own profile without a call,
  # the alternatives in the other profiles, Explain more simply and follow-ups, the names in both
  # languages after a restart, one typography, the left column unchanged, docked and standalone,
  # with zoom. Screenshots of the X display and input through the X server, the provider SIMULATED.
  profiles:
    if: ${{ !inputs.published && (inputs.only == '' || inputs.only == 'profiles') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xdotool openbox x11-xkb-utils x11-xserver-utils x11-utils imagemagick
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: test -f node_modules/electron/dist/chrome-sandbox || node node_modules/electron/install.js
        working-directory: app
      - run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
        working-directory: app
      - name: The profile trial in real windows
        run: node scripts/profile-trial.mjs release/trial-profiles/ci
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: profile-trial
          path: app/release/trial-profiles/ci

  published:
    if: ${{ inputs.published }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build -t dspatch-trial -f scripts/trial-package/Dockerfile scripts/trial-package
        working-directory: app
      - name: The published release, in clean containers
        run: node scripts/trial-package/release.mjs --published
        working-directory: app
      - name: An upgrade from the previous release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/trial-package/upgrade.mjs --from ${{ inputs.previous }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: published-trials
          path: |
            app/release/trial-published
            app/release/trial-upgrade
