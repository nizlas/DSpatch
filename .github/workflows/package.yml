# Build installers and host packages from one commit. Manual runs keep artifacts;
# version tags publish the matching packages and checksums as a GitHub release.
name: package
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  hosts-and-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: app
      - run: npm run package:host -- --platform linux
        working-directory: app
      - run: node scripts/build-host-package.mjs --platform win32
        working-directory: app
      - run: npm run package:client -- --linux deb --x64
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            app/release/*.deb
            app/release/host/
  windows-installer:
    needs: hosts-and-deb
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: app
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: app/release
      - run: npm run package:client -- --win nsis --x64 -c.win.signAndEditExecutable=true
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/release/*.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hosts-and-deb, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: app/release
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: app/release
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const {version} = require("./app/package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag and package version differ");'
      - run: node scripts/stage-release.mjs
        working-directory: app
      - name: Publish installers, hosts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" app/release/stage-"$RELEASE_TAG"/* \
            --verify-tag --title "DSpatch $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" "${extra[@]}"
